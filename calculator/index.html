<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <section class="display" aria-live="polite">
      <div class="previous-operand" id="previous-operand"></div>
      <div class="current-operand" id="current-operand">0</div>
    </section>

    <section class="keys" aria-label="Calculator keys">
      <button class="key key-wide key-muted" data-action="clear">AC</button>
      <button class="key key-muted" data-action="delete" aria-label="Delete last digit">DEL</button>
      <button class="key key-operator" data-action="operator" data-value="/" aria-label="Divide">÷</button>

      <button class="key" data-number="7">7</button>
      <button class="key" data-number="8">8</button>
      <button class="key" data-number="9">9</button>
      <button class="key key-operator" data-action="operator" data-value="*" aria-label="Multiply">×</button>

      <button class="key" data-number="4">4</button>
      <button class="key" data-number="5">5</button>
      <button class="key" data-number="6">6</button>
      <button class="key key-operator" data-action="operator" data-value="-" aria-label="Subtract">−</button>

      <button class="key" data-number="1">1</button>
      <button class="key" data-number="2">2</button>
      <button class="key" data-number="3">3</button>
      <button class="key key-operator" data-action="operator" data-value="+" aria-label="Add">+</button>

      <button class="key key-muted" data-action="sign">±</button>
      <button class="key" data-number="0">0</button>
      <button class="key" data-action="decimal">.</button>
      <button class="key key-equals" data-action="equals">=</button>
    </section>
  </main>
</body>
</html>
